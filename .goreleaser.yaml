version: 2

builds:
  - main: ./cmd/ankix
    binary: ankix
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

homebrew_casks:
  - repository:
      owner: joshgummersall
      name: homebrew-ankix
      git:
        url: "ssh://git@github.com/joshgummersall/homebrew-ankix.git"
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY_PATH }}"
    directory: Casks
    homepage: https://github.com/joshgummersall/ankix
    description: Generate contextual Anki translations from Kindle vocab highlights, YouTube transcripts, and web articles
    binaries:
      - ankix
    dependencies:
      - formula: ollama
      - formula: yt-dlp
      - cask: anki
    # Strip the quarantine xattr macOS applies to cask downloads, or
    # Gatekeeper blocks the unsigned binary. Homebrew 7 deprecated the
    # `postflight` block that hooks.post.install renders, and GoReleaser can't
    # emit `postflight_steps` until v2.19 (goreleaser/goreleaser#6873), so
    # custom_block carries it for now. The {{ "..." }} escape stops
    # GoReleaser's templating from eating Homebrew's {{staged_path}} token.
    #
    # TODO(#13): once v2.19 ships, replace custom_block with
    #   hooks:
    #     post:
    #       install_steps: |
    #         on_macos do
    #           run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}"], must_succeed: false
    #         end
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr",
              args:         ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}"],
              must_succeed: false
        end
      end
