[tools]
pnpm = "latest"

[tasks.install]
description = "Install ollama/ dependencies"
run = "pnpm install"

[tasks.create]
description = "Create the ankix Ollama model from Modelfile (set BASE_MODEL to build on a different Ollama model, default llama3.2:3b)"
# The tag must match vocab.Tag/vocab.Checksum in modelfile.go — the binary
# only ever asks for ankix:<sha256 of this Modelfile, first 12 hex chars>,
# so a model built under any other name won't be found. The checksum covers
# the Modelfile as committed, before BASE_MODEL is substituted in.
run = """
tag=$(shasum -a 256 Modelfile | cut -c1-12)
tmp=$(mktemp)
sed "s#^FROM .*#FROM ${BASE_MODEL:-llama3.2:3b}#" Modelfile > "$tmp"
ollama create "ankix:$tag" -f "$tmp"
rm "$tmp"
echo "built ankix:$tag"
"""

[tasks.eval]
description = "Run promptfoo eval against the ankix model"
run = "pnpm run eval"

[tasks.eval-correction]
description = "Run the promptfoo correction eval (multi-turn; pnpm run eval only covers the default config)"
run = "pnpm exec promptfoo eval -c promptfooconfig.correction.yaml"
