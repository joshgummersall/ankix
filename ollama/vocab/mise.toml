[tools]
pnpm = "latest"

[tasks.install]
description = "Install ollama/ dependencies"
run = "pnpm install"

[tasks.create]
description = "Create the ankix Ollama model from Modelfile (set BASE_MODEL to build on a different Ollama model, default llama3.2:3b)"
run = """
tmp=$(mktemp)
sed "s#^FROM .*#FROM ${BASE_MODEL:-llama3.2:3b}#" Modelfile > "$tmp"
ollama create ankix -f "$tmp"
rm "$tmp"
"""

[tasks.eval]
description = "Run promptfoo eval against the ankix model"
run = "pnpm run eval"

[tasks.eval-correction]
description = "Run the promptfoo correction eval (multi-turn; pnpm run eval only covers the default config)"
run = "pnpm exec promptfoo eval -c promptfooconfig.correction.yaml"
